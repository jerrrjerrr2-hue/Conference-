  }
  .band{ padding:24px 24px 18px; border-bottom:1px solid var(--line); text-align:center; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:0 0 6px; }
  .band h1{ margin:0; font-size:24px; font-weight:900; line-height:1.3; color:#fff; }
  .meta{ display:flex; justify-content:center; gap:14px; margin-top:12px; font-family:'IBM Plex Mono'; font-size:10px; color:var(--gold); }
  .body{ padding:22px 24px 24px; }

  label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin:0 0 6px; letter-spacing:.02em; }
  input[type=text], input[type=tel]{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:#00000030; font-family:'Tajawal'; font-size:15px; color:#F3EFE4;
    margin-bottom:16px; outline:none;
  }
  input::placeholder{ color:#B7AC93; }
  input:focus{ border-color:var(--gold); }

  button.submit{
    width:100%; padding:15px; border:none; border-radius:12px;
    background:linear-gradient(135deg, var(--gold), var(--amber));
    color:#1A1410; font-family:'Tajawal'; font-size:16px; font-weight:900; cursor:pointer;
  }
  button.submit:active{ transform:scale(0.98); }
  button.submit:disabled{ opacity:.6; cursor:default; }
  button.secondary{
    width:100%; padding:13px; border-radius:10px; border:1.5px solid var(--line);
    background:transparent; color:#F3EFE4; font-family:'Tajawal'; font-size:14px; font-weight:700; cursor:pointer; margin-top:10px;
  }

  .msg{ margin-top:14px; font-size:13px; text-align:center; display:none; }
  .msg.show{ display:block; }
  .msg.ok{ color:var(--ok); }
  .msg.err{ color:var(--err); }

  .hide{ display:none !important; }

  /* personal QR result */
  .ticket{ text-align:center; }
  .ticket .qrwrap{ background:#F3EFE4; border-radius:14px; padding:18px; display:inline-block; margin-bottom:14px; }
  .ticket h2{ margin:6px 0 2px; font-size:18px; color:#fff; }
  .ticket .code{ font-family:'IBM Plex Mono'; letter-spacing:.15em; color:var(--gold); font-size:15px; margin-bottom:10px; }
  .ticket p{ color:var(--muted); font-size:12.5px; margin:0 0 16px; }

  footer{ text-align:center; padding:14px; display:flex; justify-content:center; gap:18px; }
  .nav-link{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--muted); letter-spacing:.04em; background:none; border:none; cursor:pointer; text-decoration:underline; }

  /* scanner view */
  .day-select{ display:flex; gap:8px; margin-bottom:16px; }
  .day-btn{ flex:1; padding:11px 4px; border-radius:12px; border:1.5px solid var(--line); background:#00000030; color:#F3EFE4; font-family:'Tajawal'; font-size:13px; font-weight:700; cursor:pointer; text-align:center; }
  .day-btn.active{ background:var(--gold); border-color:var(--gold); color:#1A1410; }
  #readerWrap{ border-radius:14px; overflow:hidden; border:1.5px solid var(--line); margin-bottom:14px; }
  #reader{ width:100%; }
  .scan-result{ text-align:center; padding:16px; border-radius:14px; margin-bottom:14px; display:none; }
  .scan-result.show{ display:block; }
  .scan-result.ok{ background:#1F3A2A; border:1.5px solid var(--ok); }
  .scan-result.dup{ background:#3A2F1A; border:1.5px solid var(--gold); }
  .scan-result.err{ background:#3A1F1F; border:1.5px solid var(--err); }
  .scan-result h3{ margin:0 0 4px; font-size:17px; color:#fff; }
  .scan-result p{ margin:0; font-size:12px; color:var(--muted); }

  .stats{ display:flex; gap:8px; margin-bottom:16px; }
  .stat{ flex:1; background:#00000030; border:1px solid var(--line); border-radius:12px; padding:12px 4px; text-align:center; }
  .stat b{ display:block; font-size:20px; color:var(--gold); }
  .stat span{ font-size:10px; color:var(--muted); }
  .rec-list{ max-height:240px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; }
  .rec{ padding:10px 14px; border-bottom:1px solid var(--line); font-size:13px; display:flex; justify-content:space-between; }
  .rec:last-child{ border-bottom:none; }
  .rec .n{ font-weight:700; }
  .rec .d{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--muted); }
  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:20px; }
</style>
</head>
<body>

<div class="card">
  <div class="band">
    <p class="eyebrow" id="eyebrow">مؤتمر شباب</p>
    <h1>ينفع؟</h1>
    <div class="meta">
      <span>📍 بيت عنيا، أسيوط الجديدة</span>
      <span>📅 30/7 – 1/8</span>
    </div>
  </div>

  <div class="body">

    <!-- REGISTER VIEW -->
    <div id="registerView">
      <div id="registerForm">
        <label for="name">الاسم بالكامل</label>
        <input type="text" id="name" placeholder="اكتب اسمك هنا" autocomplete="name">
        <label for="phone">رقم الهاتف</label>
        <input type="tel" id="phone" placeholder="01xxxxxxxxx" autocomplete="tel">
        <button class="submit" id="registerBtn">تسجيل واستخراج الكود</button>
        <div class="msg" id="regMsg"></div>
      </div>

      <div id="ticket" class="ticket hide">
        <div class="qrwrap"><div id="ticketQr"></div></div>
        <h2 id="ticketName"></h2>
        <div class="code" id="ticketCode"></div>
        <p>ده الكود الخاص بيك — احتفظ بالسكرين شوت وهيتم مسحه عند الدخول كل يوم</p>
      </div>
    </div>

    <!-- SCANNER VIEW -->
    <div id="scanView" class="hide">
      <div class="day-select" id="daySelect">
        <button type="button" class="day-btn active" data-day="1">يوم 1</button>
        <button type="button" class="day-btn" data-day="2">يوم 2</button>
        <button type="button" class="day-btn" data-day="3">يوم 3</button>
      </div>

      <div id="readerWrap"><div id="reader"></div></div>
      <button class="secondary" id="startScanBtn">بدء المسح</button>

      <div id="scanResult" class="scan-result"><h3 id="scanResultName"></h3><p id="scanResultSub"></p></div>
    </div>

    <!-- STATS VIEW -->
    <div id="statsView" class="hide">
      <div class="stats">
        <div class="stat"><b id="statDay1">0</b><span>يوم 1</span></div>
        <div class="stat"><b id="statDay2">0</b><span>يوم 2</span></div>
        <div class="stat"><b id="statDay3">0</b><span>يوم 3</span></div>
        <div class="stat"><b id="statTotal">0</b><span>مسجلين</span></div>
      </div>
      <div id="recList" class="rec-list"></div>
    </div>

  </div>

  <footer>
    <button class="nav-link" id="toRegister">التسجيل</button>
    <button class="nav-link" id="toScan">مسح الدخول</button>
    <button class="nav-link" id="toStats">الإحصائيات</button>
  </footer>
</div>

<script>
  // ====== حط رابط الـ Google Apps Script بتاعك هنا ======
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzh51v00RhGkTLHLNOLyG4dBATVYUww5x2UfXo8cd2IFAOA4cCKy3iXO8LenPtJQZHTMA/exec";
  // =======================================================

  async function callApi(payload) {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  function uid(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }

  // ---------- REGISTER ----------
  document.getElementById('registerBtn').addEventListener('click', async () => {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const msg = document.getElementById('regMsg');
    if (!name) { msg.textContent = 'اكتب الاسم'; msg.className = 'msg show err'; return; }

    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.textContent = 'جاري التسجيل...';

    try {
      const data = await callApi({ action: 'register', name, phone });

      if (data.status !== 'ok') {
        msg.textContent = 'حصل خطأ، حاول تاني'; msg.className = 'msg show err';
        btn.disabled = false; btn.textContent = 'تسجيل واستخراج الكود';
        return;
      }

      document.getElementById('registerForm').classList.add('hide');
      const ticket = document.getElementById('ticket');
      ticket.classList.remove('hide');
      document.getElementById('ticketName').textContent = data.name;
      document.getElementById('ticketCode').textContent = data.id;
      new QRCode(document.getElementById('ticketQr'), { text: data.id, width: 170, height: 170, colorDark:"#1A1410", colorLight:"#F3EFE4" });
    } catch(e) {
      msg.textContent = 'تعذر الاتصال، تأكد من الإنترنت وحاول تاني'; msg.className = 'msg show err';
      btn.disabled = false; btn.textContent = 'تسجيل واستخراج الكود';
    }
  });

  // ---------- NAV ----------
  const views = { register: document.getElementById('registerView'), scan: document.getElementById('scanView'), stats: document.getElementById('statsView') };
  function showView(name){
    Object.values(views).forEach(v => v.classList.add('hide'));
    views[name].classList.remove('hide');
    document.getElementById('eyebrow').textContent = name === 'register' ? 'مؤتمر شباب' : (name === 'scan' ? 'مسح الدخول' : 'الإحصائيات');
    if (name === 'stats') loadStats();
  }
  document.getElementById('toRegister').addEventListener('click', () => showView('register'));
  document.getElementById('toScan').addEventListener('click', () => showView('scan'));
  document.getElementById('toStats').addEventListener('click', () => showView('stats'));

  // ---------- SCANNER ----------
  let selectedDay = "1";
  document.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedDay = btn.dataset.day;
    });
  });

  let html5QrCode = null;
  let scanning = false;
  let busyLookup = false;

  document.getElementById('startScanBtn').addEventListener('click', async () => {
    if (scanning) {
      await html5QrCode.stop();
      scanning = false;
      document.getElementById('startScanBtn').textContent = 'بدء المسح';
      return;
    }
    html5QrCode = new Html5Qrcode("reader");
    try {
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 220 },
        onScanSuccess
      );
      scanning = true;
      document.getElementById('startScanBtn').textContent = 'إيقاف المسح';
    } catch (e) {
      alert('تعذر فتح الكاميرا — تأكد من إعطاء إذن الكاميرا للمتصفح');
    }
  });

  async function onScanSuccess(decodedText) {
    if (busyLookup) return;
    busyLookup = true;

    const id = decodedText.trim().toUpperCase();
    const resultBox = document.getElementById('scanResult');
    const resultName = document.getElementById('scanResultName');
    const resultSub = document.getElementById('scanResultSub');

    try {
      const data = await callApi({ action: 'checkin', id, day: selectedDay });

      if (data.status === 'not_found') {
        resultBox.className = 'scan-result show err';
        resultName.textContent = 'الكود غير مسجل';
        resultSub.textContent = 'اطلب منه يسجل من صفحة التسجيل الأول';
      } else if (data.status === 'duplicate') {
        resultBox.className = 'scan-result show dup';
        resultName.textContent = data.name;
        resultSub.textContent = 'مسجل حضوره في هذا اليوم بالفعل';
      } else if (data.status === 'ok') {
        resultBox.className = 'scan-result show ok';
        resultName.textContent = data.name;
        resultSub.textContent = 'تم تسجيل الحضور بنجاح';
      } else {
        resultBox.className = 'scan-result show err';
        resultName.textContent = 'خطأ';
        resultSub.textContent = 'حاول تاني';
      }
    } catch (e) {
      resultBox.className = 'scan-result show err';
      resultName.textContent = 'تعذر الاتصال';
      resultSub.textContent = 'تأكد من الإنترنت وحاول تاني';
    }

    setTimeout(() => { busyLookup = false; resultBox.classList.remove('show'); }, 2200);
  }

  // ---------- STATS ----------
  async function loadStats() {
    const recList = document.getElementById('recList');
    recList.innerHTML = '<div class="empty">جاري التحميل...</div>';
    try {
      const data = await callApi({ action: 'stats' });
      const records = (data && data.records) ? data.records : [];
      if (records.length === 0) {
        recList.innerHTML = '<div class="empty">لا يوجد حضور مسجل حتى الآن</div>';
        ['statDay1','statDay2','statDay3','statTotal'].forEach(id => document.getElementById(id).textContent = 0);
        return;
      }
      records.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      document.getElementById('statDay1').textContent = records.filter(r=>r.day==='1').length;
      document.getElementById('statDay2').textContent = records.filter(r=>r.day==='2').length;
      document.getElementById('statDay3').textContent = records.filter(r=>r.day==='3').length;
      document.getElementById('statTotal').textContent = records.length;
      const dayNames = {"1":"يوم 1","2":"يوم 2","3":"يوم 3"};
      recList.innerHTML = records.map(r => {
        const t = new Date(r.timestamp);
        const timeStr = t.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
        return `<div class="rec"><span class="n">${escapeHtml(r.name)}</span><span class="d">${dayNames[r.day]||r.day} · ${timeStr}</span></div>`;
      }).join('');
    } catch(e) {
      recList.innerHTML = '<div class="empty">تعذر تحميل القائمة</div>';
    }
  }

  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
</script>

</body>
</html>
